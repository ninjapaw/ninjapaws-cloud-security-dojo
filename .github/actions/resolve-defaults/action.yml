name: Resolve runtime defaults
description: >-
  Resolves Ninja Paws runtime configuration for a job. GitHub Environment
  variables always win; config/deploy.config.json's `defaults` block is the
  single source of truth for every fallback value, so no literal default is
  duplicated across workflow files.
inputs:
  vars-json:
    description: The calling workflow's toJSON(vars) context
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VARS_JSON: ${{ inputs.vars-json }}
      run: node "${{ github.action_path }}/resolve.js"
