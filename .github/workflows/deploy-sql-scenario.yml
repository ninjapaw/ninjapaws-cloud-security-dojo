name: 🛡️ Deploy SQL Scenario (Scenario 2) to Azure

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Lifecycle stage
        required: false
        default: deploy
        type: choice
        options: [plan, doctor, deploy, domain, uninstall]
      environment:
        description: Target environment
        required: false
        default: dev
        type: choice
        options: [dev, prod]
      confirm_resource_group:
        description: "Uninstall only: type the exact resource group name to confirm deletion"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

# Scenario 2 provisions its own resource group and VM, independent of Scenario 1's App
# Service/ACR estate, so it gets its own concurrency group instead of sharing Scenario 1's.
concurrency:
  group: deploy-sql-scenario-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  sql-scenario:
    name: SQL Server VM scenario (${{ inputs.stage }})
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/scenario-lifecycle.yml
    with:
      scenario_name: SQL Server VM scenario
      summary_heading: 🛡️ SQL Scenario Summary
      script_path: scripts/deploy-sql-scenario.sh
      stage: ${{ inputs.stage }}
      environment: ${{ inputs.environment }}
      # Matches config/deploy.config.json's environments.<env>.sqlResourceGroup default.
      resource_group: ${{ inputs.environment == 'prod' && 'NP-ninjapaws-dojo-sql-Prod-CentralUS' || 'NP-ninjapaws-dojo-sql-Dev-CentralUS' }}
      location: ${{ vars.AZURE_LOCATION || 'centralus' }}
      require_uninstall_confirmation: true
      confirm_resource_group: ${{ inputs.confirm_resource_group }}

  defender-posture:
    name: Defender posture audit
    if: inputs.stage != 'plan' && inputs.stage != 'uninstall' && inputs.stage != 'domain'
    needs: sql-scenario
    permissions:
      contents: read
      id-token: write
    uses: ninjapaw/pawprint/.github/workflows/kit-defender-posture.yml@889f24b85b6c30b260931dd6b8b1b7d5d6c4f3b6
    with:
      environment: ${{ inputs.environment }}
      resource-group: ${{ inputs.environment == 'prod' && 'NP-ninjapaws-dojo-sql-Prod-CentralUS' || 'NP-ninjapaws-dojo-sql-Dev-CentralUS' }}
      location: ${{ vars.AZURE_LOCATION || 'centralus' }}
      apply: ${{ vars.DEFENDER_MANAGE_PLANS != 'false' && vars.DEFENDER_MANAGE_EXTENSIONS != 'false' }}
      defender-appservices-tier: ${{ vars.DEFENDER_APPSERVICES_TIER || 'Standard' }}
      defender-containers-tier: disabled
      defender-cspm-tier: ${{ vars.DEFENDER_CSPM_TIER || 'Standard' }}
      defender-arm-tier: ${{ vars.DEFENDER_ARM_TIER || 'Standard' }}
      defender-servers-tier: ${{ vars.DEFENDER_SERVERS_TIER || 'Standard' }}
      defender-servers-subplan: ${{ vars.DEFENDER_SERVERS_SUBPLAN || 'P2' }}
      defender-sql-tier: ${{ vars.DEFENDER_SQL_TIER || 'Standard' }}
      defender-cspm-agentless-serverless-posture: ${{ vars.DEFENDER_CSPM_SERVERLESS_PROTECTION || 'true' }}
      defender-cspm-serverless-containers: ${{ vars.DEFENDER_CSPM_SERVERLESS_CONTAINERS || 'true' }}
      defender-cspm-registry-assessment: disabled
      defender-cspm-kubernetes-discovery: disabled
      defender-cspm-vm-scanning: ${{ vars.DEFENDER_CSPM_VM_SCANNING || 'false' }}
      defender-cspm-sensitive-data: ${{ vars.DEFENDER_CSPM_SENSITIVE_DATA || 'false' }}
      defender-cspm-permissions-management: ${{ vars.DEFENDER_CSPM_PERMISSIONS_MANAGEMENT || 'false' }}
      defender-cspm-api-posture: ${{ vars.DEFENDER_CSPM_API_POSTURE || 'false' }}
      defender-containers-registry-assessment: disabled
      defender-containers-kubernetes-discovery: disabled
      defender-containers-vm-scanning: disabled
      defender-containers-sensor: disabled
      defender-devops-connector-enabled: ${{ vars.DEFENDER_DEVOPS_CONNECTOR_ENABLED || 'true' }}
      defender-devops-connector-name: ${{ vars.DEFENDER_DEVOPS_CONNECTOR_NAME || 'ninjapaws-github' }}
      defender-devops-github-owner: ${{ vars.DEFENDER_DEVOPS_GITHUB_OWNER || github.repository_owner }}
      github-advanced-security-expected: ${{ vars.ADVANCED_SECURITY_EXPECTED || 'true' }}
