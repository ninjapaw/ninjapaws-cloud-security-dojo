name: ⚔️ Deploy to Azure

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options: [auto-detect, development, production]
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write

# dev maps to development, main maps to production.
concurrency:
  group: deploy-${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'production' || 'development') }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deployment-${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'production' || 'development') }}
    env:
      DEPLOY_ENVIRONMENT: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'production' || 'development') }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || (github.ref_name == 'main' && 'NP-ninjapaws-dojo-CentralUS' || '') }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'centralus' }}
      CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME || (github.ref_name == 'main' && 'ninjapawsdojo' || '') }}
      APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME || (github.ref_name == 'main' && 'ninjapaws-dojo-app' || '') }}
      IMAGE_NAME: ninjapaws-dojo
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

    steps:
      - name: 🥷 Checkout repository
        uses: actions/checkout@v4

      - name: 🧭 Verify branch matches environment
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          case "$SOURCE_REF" in
            main) detected=production ;;
            dev) detected=development ;;
            *)
              echo "::error title=Unsupported branch::Deploy from 'dev' (development) or 'main' (production), not '$SOURCE_REF'."
              exit 1
              ;;
          esac

          if [[ "$DEPLOY_ENVIRONMENT" != "$detected" ]]; then
            echo "::error title=Branch and environment mismatch::Branch '$SOURCE_REF' maps to $detected, not $DEPLOY_ENVIRONMENT."
            exit 1
          fi

          # Non-production targets have no implicit resource names, so nothing is provisioned by accident.
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP in the deployment-$DEPLOY_ENVIRONMENT Environment}"
          : "${CONTAINER_REGISTRY_NAME:?Set AZURE_CONTAINER_REGISTRY_NAME in the deployment-$DEPLOY_ENVIRONMENT Environment}"
          : "${APP_SERVICE_NAME:?Set AZURE_APP_SERVICE_NAME in the deployment-$DEPLOY_ENVIRONMENT Environment}"

          echo "Deploying '$SOURCE_REF' to the $DEPLOY_ENVIRONMENT environment." >> "$GITHUB_STEP_SUMMARY"

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🏗️ Create/validate Azure resource group
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output table

      - name: 🧱 Deploy Azure infrastructure
        run: |
          az deployment group create \
            --name "ninjapaws-${{ github.run_id }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$LOCATION" \
              containerRegistryName="$CONTAINER_REGISTRY_NAME" \
              appServiceName="$APP_SERVICE_NAME" \
            --output table

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Get ACR login server
        run: |
          ACR_LOGIN_SERVER=$(az acr show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_REGISTRY_NAME" --query loginServer -o tsv)
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: 🐳 Build and push image to ACR
        run: |
          az acr login --name "$CONTAINER_REGISTRY_NAME"
          docker build \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: 🚀 Configure App Service container image
        run: |
          az webapp config container set \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-custom-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --docker-registry-server-url "https://$ACR_LOGIN_SERVER"

      - name: ⚙️ Set app settings
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --settings \
              WEBSITES_PORT=80 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
              NGINX_VERSION=1.30.3 \
              VULNERABILITY_STATUS=vulnerable \
              PORT=3000 \
              DOCKER_REGISTRY_SERVER_URL="https://$ACR_LOGIN_SERVER"

      - name: ♻️ Restart the app
        run: |
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_NAME"

      - name: 🏥 Health check
        run: |
          HEALTH_ENDPOINT="https://${APP_SERVICE_NAME}.azurewebsites.net/health"
          echo "Checking health endpoint: $HEALTH_ENDPOINT"
          for i in {1..12}; do
            if curl -fsS "$HEALTH_ENDPOINT" > /dev/null; then
              echo "✅ Application is healthy"
              curl -fsS "$HEALTH_ENDPOINT"
              exit 0
            fi
            echo "Attempt $i/12 - waiting for the app to respond..."
            sleep 10
          done
          echo "❌ Application health check failed"
          exit 1

      - name: 📊 Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** $DEPLOY_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource group:** $RESOURCE_GROUP" >> "$GITHUB_STEP_SUMMARY"
          echo "**App Service:** $APP_SERVICE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Container registry:** $CONTAINER_REGISTRY_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://${APP_SERVICE_NAME}.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"

      - name: 📢 Deployment status comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Deployment Status:** ${{ job.status }}\n\n**App Service:** https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net`
            }).catch(() => console.log('Not a PR context'));
