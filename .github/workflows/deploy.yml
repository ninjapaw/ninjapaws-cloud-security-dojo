name: ⚔️ Deploy to Azure

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: ""
        type: string
      stage:
        description: Deployment stage
        required: false
        default: full
        type: choice
        options: [full, doctor, provision, build, deploy, verify, repair]

permissions:
  contents: read
  id-token: write

# Branch dev uses the dev environment, branch main uses the prod environment.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Azure deployment is an explicit promotion action; validation workflows handle pushes and PRs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || 'unsupported' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || 'unsupported' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'centralus' }}
      CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
      IMAGE_NAME: ${{ vars.AZURE_IMAGE_NAME || 'ninjapaws-dojo' }}
      BASE_OS_IMAGE: ${{ vars.BASE_OS_IMAGE || 'ubuntu' }}
      BASE_OS_VERSION: ${{ vars.BASE_OS_VERSION || '24.04' }}
      NGINX_VERSION: ${{ vars.NGINX_VERSION || '1.30.3' }}
      VULNERABILITY_STATUS: ${{ vars.VULNERABILITY_STATUS || 'vulnerable' }}
      NODE_MAJOR_VERSION: ${{ vars.NODE_MAJOR_VERSION || '20' }}
      PORT: ${{ vars.PORT || '3000' }}
      NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
      NPM_USE_MIRROR: ${{ vars.NPM_USE_MIRROR || 'true' }}
      NPM_NETWORK_MODE: ${{ vars.NPM_NETWORK_MODE || 'online' }}
      DEFENDER_ENABLED: ${{ vars.DEFENDER_ENABLED || 'true' }}
      DEFENDER_SCAN_ENABLED: ${{ vars.DEFENDER_SCAN_ENABLED || 'true' }}
      DEFENDER_MANAGE_PLANS: ${{ vars.DEFENDER_MANAGE_PLANS || 'true' }}
      DEFENDER_TARGET_CVE: ${{ vars.DEFENDER_TARGET_CVE || 'CVE-2026-42533' }}
      DEFENDER_APPSERVICES_TIER: ${{ vars.DEFENDER_APPSERVICES_TIER || 'Standard' }}
      DEFENDER_CONTAINERS_TIER: ${{ vars.DEFENDER_CONTAINERS_TIER || 'Standard' }}
      DEFENDER_CSPM_TIER: ${{ vars.DEFENDER_CSPM_TIER || 'Standard' }}
      DEFENDER_ARM_TIER: ${{ vars.DEFENDER_ARM_TIER || 'Standard' }}
      DEFENDER_MANAGE_EXTENSIONS: ${{ vars.DEFENDER_MANAGE_EXTENSIONS || 'true' }}
      DEFENDER_CSPM_SERVERLESS_PROTECTION: ${{ vars.DEFENDER_CSPM_SERVERLESS_PROTECTION || 'true' }}
      DEFENDER_CSPM_SERVERLESS_CONTAINERS: ${{ vars.DEFENDER_CSPM_SERVERLESS_CONTAINERS || 'true' }}
      DEFENDER_CSPM_REGISTRY_ASSESSMENT: ${{ vars.DEFENDER_CSPM_REGISTRY_ASSESSMENT || 'true' }}
      DEFENDER_CSPM_KUBERNETES_DISCOVERY: ${{ vars.DEFENDER_CSPM_KUBERNETES_DISCOVERY || 'false' }}
      DEFENDER_CSPM_VM_SCANNING: ${{ vars.DEFENDER_CSPM_VM_SCANNING || 'true' }}
      DEFENDER_CSPM_SENSITIVE_DATA: ${{ vars.DEFENDER_CSPM_SENSITIVE_DATA || 'false' }}
      DEFENDER_CSPM_PERMISSIONS_MANAGEMENT: ${{ vars.DEFENDER_CSPM_PERMISSIONS_MANAGEMENT || 'false' }}
      DEFENDER_CSPM_API_POSTURE: ${{ vars.DEFENDER_CSPM_API_POSTURE || 'true' }}
      DEFENDER_CONTAINERS_REGISTRY_ASSESSMENT: ${{ vars.DEFENDER_CONTAINERS_REGISTRY_ASSESSMENT || 'true' }}
      DEFENDER_CONTAINERS_KUBERNETES_DISCOVERY: ${{ vars.DEFENDER_CONTAINERS_KUBERNETES_DISCOVERY || 'false' }}
      DEFENDER_CONTAINERS_VM_SCANNING: ${{ vars.DEFENDER_CONTAINERS_VM_SCANNING || 'true' }}
      DEFENDER_CONTAINERS_SENSOR: ${{ vars.DEFENDER_CONTAINERS_SENSOR || 'false' }}
      DEFENDER_DEVOPS_CONNECTOR_ENABLED: ${{ vars.DEFENDER_DEVOPS_CONNECTOR_ENABLED || 'true' }}
      DEFENDER_DEVOPS_CONNECTOR_NAME: ${{ vars.DEFENDER_DEVOPS_CONNECTOR_NAME || 'ninjapaws-github' }}
      DEFENDER_DEVOPS_GITHUB_OWNER: ${{ vars.DEFENDER_DEVOPS_GITHUB_OWNER || github.repository_owner }}
      GITHUB_ADVANCED_SECURITY_EXPECTED: ${{ vars.GITHUB_ADVANCED_SECURITY_EXPECTED || 'true' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      DEPLOY_STAGE: ${{ inputs.stage || 'full' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: 🥷 Checkout repository
        uses: actions/checkout@v4

      - name: 🧭 Verify branch matches environment
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          case "$SOURCE_REF" in
            main) detected=prod ;;
            dev) detected=dev ;;
            *)
              echo "::error title=Unsupported branch::Deploy from 'dev' or 'main', not '$SOURCE_REF'."
              exit 1
              ;;
          esac

          if [[ "$DEPLOY_ENVIRONMENT" != "$detected" ]]; then
            echo "::error title=Branch and environment mismatch::Branch '$SOURCE_REF' maps to $detected, not $DEPLOY_ENVIRONMENT."
            exit 1
          fi

          if [[ "$DEPLOY_ENVIRONMENT" == unsupported ]]; then
            echo "::error title=Unsupported deployment branch::Only 'dev' and 'main' deploy automatically."
            exit 1
          fi

          # Non-production targets have no implicit resource names, so nothing is provisioned by accident.
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP in the $DEPLOY_ENVIRONMENT Environment}"
          : "${CONTAINER_REGISTRY_NAME:?Set AZURE_CONTAINER_REGISTRY_NAME in the $DEPLOY_ENVIRONMENT Environment}"
          : "${APP_SERVICE_NAME:?Set AZURE_APP_SERVICE_NAME in the $DEPLOY_ENVIRONMENT Environment}"
          : "${AZURE_CLIENT_ID:?Set AZURE_CLIENT_ID as an Environment variable in the $DEPLOY_ENVIRONMENT Environment}"
          : "${AZURE_TENANT_ID:?Set AZURE_TENANT_ID as an Environment variable in the $DEPLOY_ENVIRONMENT Environment}"
          : "${SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID as an Environment variable in the $DEPLOY_ENVIRONMENT Environment}"

          echo "Deploying '$SOURCE_REF' to the $DEPLOY_ENVIRONMENT environment." >> "$GITHUB_STEP_SUMMARY"

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: 🧪 Validate Bicep and preview changes
        if: env.DEPLOY_STAGE != 'verify' && env.DEPLOY_STAGE != 'build'
        run: |
          scripts/deploy.sh doctor \
            --environment "$DEPLOY_ENVIRONMENT" \
            --subscription "$SUBSCRIPTION_ID" \
            --location "$LOCATION" \
            --resource-group "$RESOURCE_GROUP" \
            --registry-name "$CONTAINER_REGISTRY_NAME" \
            --app-service-name "$APP_SERVICE_NAME" \
            --image-name "$IMAGE_NAME"

      - name: 🧭 Run staged deployment wizard
        env:
          DEPLOY_STAGE: ${{ env.DEPLOY_STAGE }}
        run: |
          case "$DEPLOY_STAGE" in
            full) stage=deploy ;;
            doctor|provision|build|deploy|verify|repair) stage="$DEPLOY_STAGE" ;;
            *) echo "Unsupported deployment stage: $DEPLOY_STAGE" >&2; exit 1 ;;
          esac
          scripts/deploy.sh "$stage" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --subscription "$SUBSCRIPTION_ID" \
            --location "$LOCATION" \
            --resource-group "$RESOURCE_GROUP" \
            --registry-name "$CONTAINER_REGISTRY_NAME" \
            --app-service-name "$APP_SERVICE_NAME" \
            --image-name "$IMAGE_NAME" \
            --image-tag "$IMAGE_TAG" \
            --yes

      - name: 📊 Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** $DEPLOY_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource group:** $RESOURCE_GROUP" >> "$GITHUB_STEP_SUMMARY"
          echo "**App Service:** $APP_SERVICE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Container registry:** $CONTAINER_REGISTRY_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** $CONTAINER_REGISTRY_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://${APP_SERVICE_NAME}.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"

      - name: 📢 Deployment status comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Deployment Status:** ${{ job.status }}\n\n**App Service:** https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net`
            }).catch(() => console.log('Not a PR context'));

  defender-posture:
    name: Defender posture audit
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-deploy
    permissions:
      contents: read
      id-token: write
    uses: ninjapaw/pawprint/.github/workflows/kit-defender-posture.yml@de65a5017f51b2ca9213ec07b5fbfc889262fee2
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || 'unsupported' }}
      resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
      location: ${{ vars.AZURE_LOCATION || 'centralus' }}
      apply: ${{ vars.DEFENDER_MANAGE_PLANS != 'false' && vars.DEFENDER_MANAGE_EXTENSIONS != 'false' }}
      defender-appservices-tier: ${{ vars.DEFENDER_APPSERVICES_TIER || 'Standard' }}
      defender-containers-tier: ${{ vars.DEFENDER_CONTAINERS_TIER || 'Standard' }}
      defender-cspm-tier: ${{ vars.DEFENDER_CSPM_TIER || 'Standard' }}
      defender-arm-tier: ${{ vars.DEFENDER_ARM_TIER || 'Standard' }}
      defender-cspm-agentless-serverless-posture: ${{ vars.DEFENDER_CSPM_SERVERLESS_PROTECTION || 'true' }}
      defender-cspm-serverless-containers: ${{ vars.DEFENDER_CSPM_SERVERLESS_CONTAINERS || 'true' }}
      defender-cspm-registry-assessment: ${{ vars.DEFENDER_CSPM_REGISTRY_ASSESSMENT || 'true' }}
      defender-cspm-kubernetes-discovery: ${{ vars.DEFENDER_CSPM_KUBERNETES_DISCOVERY || 'false' }}
      defender-cspm-vm-scanning: ${{ vars.DEFENDER_CSPM_VM_SCANNING || 'true' }}
      defender-cspm-sensitive-data: ${{ vars.DEFENDER_CSPM_SENSITIVE_DATA || 'false' }}
      defender-cspm-permissions-management: ${{ vars.DEFENDER_CSPM_PERMISSIONS_MANAGEMENT || 'false' }}
      defender-cspm-api-posture: ${{ vars.DEFENDER_CSPM_API_POSTURE || 'true' }}
      defender-containers-registry-assessment: ${{ vars.DEFENDER_CONTAINERS_REGISTRY_ASSESSMENT || 'true' }}
      defender-containers-kubernetes-discovery: ${{ vars.DEFENDER_CONTAINERS_KUBERNETES_DISCOVERY || 'false' }}
      defender-containers-vm-scanning: ${{ vars.DEFENDER_CONTAINERS_VM_SCANNING || 'true' }}
      defender-containers-sensor: ${{ vars.DEFENDER_CONTAINERS_SENSOR || 'false' }}
      defender-devops-connector-enabled: ${{ vars.DEFENDER_DEVOPS_CONNECTOR_ENABLED || 'true' }}
      defender-devops-connector-name: ${{ vars.DEFENDER_DEVOPS_CONNECTOR_NAME || 'ninjapaws-github' }}
      defender-devops-github-owner: ${{ vars.DEFENDER_DEVOPS_GITHUB_OWNER || github.repository_owner }}
      github-advanced-security-expected: ${{ vars.GITHUB_ADVANCED_SECURITY_EXPECTED || 'true' }}
