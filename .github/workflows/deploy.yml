name: ⚔️ Deploy to Azure

on:
  push:
    branches:
      - main
      - fix/cve-2026-42533
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: myregistry.azurecr.io
  IMAGE_NAME: ninjapaws-dojo
  RESOURCE_GROUP: ninjapaws-dojo
  APP_SERVICE_NAME: ninjapaws-dojo-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 🥷 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Azure Login (Federated Identity)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Azure Container Registry
        run: |
          az acr login --name ${REGISTRY%%.*}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: 🔍 Scan Image with Defender for Cloud
        run: |
          echo "Image pushed to ACR: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Microsoft Defender for Cloud will automatically scan this image"
          echo "Check Azure Portal > Defender for Cloud > Container registries for results"

      - name: 🚀 Deploy to Azure App Service
        run: |
          az webapp config container set \
            --name ${{ env.APP_SERVICE_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --docker-registry-server-url https://${{ env.REGISTRY }} \
            --docker-registry-server-username $(az account show --query clientId -o tsv) \
            --docker-registry-server-password $(az account get-access-token --query accessToken -o tsv)

      - name: ⏳ Wait for deployment
        run: |
          echo "Waiting for App Service to pull and start new image..."
          sleep 30

      - name: 🏥 Health Check
        run: |
          HEALTH_ENDPOINT="https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net/health"
          echo "Checking health endpoint: $HEALTH_ENDPOINT"
          
          for i in {1..10}; do
            echo "Attempt $i/10..."
            if curl -sf "$HEALTH_ENDPOINT" > /dev/null; then
              echo "✅ Application is healthy"
              curl -s "$HEALTH_ENDPOINT" | jq '.'
              exit 0
            fi
            sleep 10
          done
          
          echo "❌ Application health check failed"
          exit 1

      - name: 📊 Get Deployment Info
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application:** ${{ env.APP_SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Defender for Cloud:** Check Azure Portal for image scanning results" >> $GITHUB_STEP_SUMMARY

      - name: 📢 Notify Deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Deployment Status:** ${{ job.status }}\n\n**App Service:** https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net`
            }) || console.log('Not a PR context');
