name: ⚔️ Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - name: 🥷 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Load shared configuration
        run: |
          jq -e . config.json > /dev/null
          echo "RESOURCE_GROUP=$(jq -r '.deployment.resourceGroup' config.json)" >> "$GITHUB_ENV"
          CONFIG_LOCATION=$(jq -r '.deployment.location' config.json)
          echo "LOCATION=${AZURE_LOCATION:-$CONFIG_LOCATION}" >> "$GITHUB_ENV"
          echo "CONTAINER_REGISTRY_NAME=$(jq -r '.deployment.containerRegistryName' config.json)" >> "$GITHUB_ENV"
          echo "APP_SERVICE_NAME=$(jq -r '.deployment.appServiceName' config.json)" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$(jq -r '.image.name' config.json)" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_ENV"
          echo "UBUNTU_VERSION=$(jq -r '.image.ubuntuVersion' config.json)" >> "$GITHUB_ENV"
          echo "NODE_MAJOR_VERSION=$(jq -r '.image.nodeMajorVersion' config.json)" >> "$GITHUB_ENV"
          echo "NGINX_VERSION=$(jq -r '.runtime.nginxVersion' config.json)" >> "$GITHUB_ENV"
          echo "VULNERABILITY_STATUS=$(jq -r '.runtime.vulnerabilityStatus' config.json)" >> "$GITHUB_ENV"
          echo "APP_PORT=$(jq -r '.runtime.port' config.json)" >> "$GITHUB_ENV"
          echo "DEFENDER_ENABLED=$(jq -r '.runtime.defenderEnabled' config.json)" >> "$GITHUB_ENV"

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🏗️ Create/validate Azure resource group
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output table

      - name: 🧱 Deploy Azure infrastructure
        run: |
          az deployment group create \
            --name "ninjapaws-${{ github.run_id }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters location="$LOCATION" \
            --output table

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Get ACR login server
        run: |
          ACR_LOGIN_SERVER=$(az acr show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_REGISTRY_NAME" --query loginServer -o tsv)
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: 🐳 Build and push image to ACR
        run: |
          az acr login --name "$CONTAINER_REGISTRY_NAME"
          docker build \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            --build-arg "UBUNTU_VERSION=$UBUNTU_VERSION" \
            --build-arg "NODE_MAJOR_VERSION=$NODE_MAJOR_VERSION" \
            --build-arg "NGINX_VERSION=$NGINX_VERSION" \
            --build-arg "VULNERABILITY_STATUS=$VULNERABILITY_STATUS" \
            --build-arg "PORT=$APP_PORT" \
            .
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: 🚀 Configure App Service container image
        run: |
          az webapp config container set \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-custom-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --docker-registry-server-url "https://$ACR_LOGIN_SERVER"

      - name: ⚙️ Set app settings
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --settings \
              WEBSITES_PORT=80 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
              NGINX_VERSION="$NGINX_VERSION" \
              VULNERABILITY_STATUS="$VULNERABILITY_STATUS" \
              PORT="$APP_PORT" \
              DEFENDER_ENABLED="$DEFENDER_ENABLED" \
              DOCKER_REGISTRY_SERVER_URL="https://$ACR_LOGIN_SERVER"

      - name: ♻️ Restart the app
        run: |
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_NAME"

      - name: 🏥 Health check
        run: |
          HEALTH_ENDPOINT="https://${APP_SERVICE_NAME}.azurewebsites.net/health"
          echo "Checking health endpoint: $HEALTH_ENDPOINT"
          for i in {1..12}; do
            if curl -fsS "$HEALTH_ENDPOINT" > /dev/null; then
              echo "✅ Application is healthy"
              curl -fsS "$HEALTH_ENDPOINT"
              exit 0
            fi
            echo "Attempt $i/12 - waiting for the app to respond..."
            sleep 10
          done
          echo "❌ Application health check failed"
          exit 1

      - name: 📊 Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource group:** $RESOURCE_GROUP" >> "$GITHUB_STEP_SUMMARY"
          echo "**App Service:** $APP_SERVICE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Container registry:** $CONTAINER_REGISTRY_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://${APP_SERVICE_NAME}.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"
