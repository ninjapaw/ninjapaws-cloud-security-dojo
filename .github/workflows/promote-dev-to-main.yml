name: Promote dev to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    uses: ninjapaw/pawprint/.github/workflows/kit-promote.yml@18e1d946fa59333e4905a83759748f04887a5e02
    with:
      source-branch: dev
      target-branch: main
      require-ci: true
      ci-workflow: validate-infrastructure.yml
      pr-title: Promote dev to main
