name: Promote dev to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    uses: ninjapaw/pawprint/.github/workflows/kit-promote.yml@de65a5017f51b2ca9213ec07b5fbfc889262fee2
    with:
      source-branch: dev
      target-branch: main
      require-ci: true
      ci-workflow: validate-infrastructure.yml
      pr-title: Promote dev to main
