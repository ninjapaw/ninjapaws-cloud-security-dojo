name: Promote dev to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    uses: ninjapaw/pawprint/.github/workflows/kit-promote.yml@8ae2b35bfb4fd92fbd2649306a038c794de2b0e6
    with:
      source-branch: dev
      target-branch: main
      require-ci: true
      ci-workflow: validate-infrastructure.yml
      pr-title: Promote dev to main
