name: Promote dev to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    uses: ninjapaw/pawprint/.github/workflows/kit-promote.yml@5b51e06db472b7627d417ef3a99824155b4c3411
    with:
      source-branch: dev
      target-branch: main
      require-ci: true
      ci-workflow: validate-infrastructure.yml
      pr-title: Promote dev to main
