name: Publish dev prerelease

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: publish-dev-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Verify source branch
        run: |
          if [[ "$GITHUB_REF_NAME" != dev ]]; then
            echo "Run this workflow from the dev branch. Current ref: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve runtime defaults
        uses: ./.github/actions/resolve-defaults
        with:
          vars-json: ${{ toJSON(vars) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_MAJOR_VERSION }}
          cache: npm

      - name: Validate application and infrastructure
        run: |
          npm ci
          npm test
          bash scripts/test.sh --skip-azure

      - name: Determine version bump
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/determine-version-bump.sh

      - name: Compute prerelease version and tag
        id: preview
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          current_version=$(node -p "require('./package.json').version")
          next_version=$(node -e '
            const [cur, bump] = process.argv.slice(1);
            const [maj, min, pat] = cur.split(".").map(Number);
            let next;
            if (bump === "major") next = [maj + 1, 0, 0];
            else if (bump === "minor") next = [maj, min + 1, 0];
            else next = [maj, min, pat + 1];
            process.stdout.write(next.join("."));
          ' "$current_version" "$BUMP")

          prerelease_version="${next_version}-dev.${GITHUB_RUN_NUMBER}"
          tag="v${prerelease_version}"

          if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Prerelease $tag already exists; skipping duplicate publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$prerelease_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Create prerelease tag and GitHub prerelease
        if: steps.preview.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "${{ steps.preview.outputs.tag }}" -m "Preview ${{ steps.preview.outputs.tag }} (${{ steps.bump.outputs.source }})"
          git push origin "${{ steps.preview.outputs.tag }}"
          gh release create "${{ steps.preview.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.preview.outputs.tag }} (dev preview)" \
            --generate-notes \
            --prerelease \
            --latest=false

      - name: Prerelease summary
        if: steps.preview.outputs.should_publish == 'true'
        run: |
          {
            echo "## Dev prerelease published"
            echo ""
            echo "**Tag:** ${{ steps.preview.outputs.tag }}"
            echo "**Marked:** prerelease (never latest)"
            echo "**Next planned bump:** ${{ steps.bump.outputs.bump }} (${{ steps.bump.outputs.source }})"
            echo "**Reason:** ${{ steps.bump.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
