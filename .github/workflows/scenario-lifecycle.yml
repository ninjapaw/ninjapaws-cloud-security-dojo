name: 🧩 Scenario Lifecycle

on:
  workflow_call:
    inputs:
      scenario_name:
        description: Friendly scenario name for logs and summaries.
        required: true
        type: string
      summary_heading:
        description: Markdown heading for the GitHub step summary.
        required: false
        default: Scenario Summary
        type: string
      script_path:
        description: Repository-relative lifecycle script to execute.
        required: true
        type: string
      stage:
        description: Lifecycle stage to execute.
        required: true
        type: string
      environment:
        description: GitHub Environment / dojo environment to target.
        required: true
        type: string
      resource_group:
        description: Azure resource group owned by this scenario.
        required: false
        default: ""
        type: string
      location:
        description: Azure region for scripts that accept --location.
        required: false
        default: centralus
        type: string
      require_uninstall_confirmation:
        description: Require confirm_resource_group to match resource_group for uninstall.
        required: false
        default: true
        type: boolean
      confirm_resource_group:
        description: Exact resource-group confirmation supplied by the caller.
        required: false
        default: ""
        type: string
      azure_login_for_plan:
        description: Whether the plan stage should authenticate to Azure.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  lifecycle:
    name: ${{ inputs.scenario_name }} (${{ inputs.stage }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      SCENARIO_NAME: ${{ inputs.scenario_name }}
      SCENARIO_STAGE: ${{ inputs.stage }}
      SCENARIO_SCRIPT: ${{ inputs.script_path }}
      SCENARIO_RESOURCE_GROUP: ${{ inputs.resource_group }}
      LOCATION: ${{ inputs.location }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: 🥷 Checkout repository
        uses: actions/checkout@v4

      - name: 🧭 Validate scenario lifecycle inputs
        run: |
          case "$SCENARIO_STAGE" in
            plan|doctor|deploy|verify|uninstall) ;;
            *)
              echo "::error title=Unsupported lifecycle stage::Stage '$SCENARIO_STAGE' is not supported by the reusable scenario lifecycle workflow."
              exit 1
              ;;
          esac

          [[ -f "$SCENARIO_SCRIPT" ]] || {
            echo "::error title=Missing scenario script::$SCENARIO_SCRIPT does not exist."
            exit 1
          }

          if [[ "$SCENARIO_STAGE" != plan || "${{ inputs.azure_login_for_plan }}" == true ]]; then
            : "${AZURE_CLIENT_ID:?Set AZURE_CLIENT_ID as an Environment variable in the $DEPLOY_ENVIRONMENT Environment}"
            : "${AZURE_TENANT_ID:?Set AZURE_TENANT_ID as an Environment variable in the $DEPLOY_ENVIRONMENT Environment}"
            : "${SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID as an Environment variable in the $DEPLOY_ENVIRONMENT Environment}"
          fi

          echo "Running $SCENARIO_NAME stage '$SCENARIO_STAGE' against $DEPLOY_ENVIRONMENT." >> "$GITHUB_STEP_SUMMARY"

      - name: 🛑 Validate deletion confirmation
        if: inputs.stage == 'uninstall' && inputs.require_uninstall_confirmation
        run: |
          if [[ -z "$SCENARIO_RESOURCE_GROUP" ]]; then
            echo "::error title=Missing resource group::resource_group is required when uninstall confirmation is enabled."
            exit 1
          fi
          if [[ "${{ inputs.confirm_resource_group }}" != "$SCENARIO_RESOURCE_GROUP" ]]; then
            echo "::error title=Confirmation mismatch::Type '$SCENARIO_RESOURCE_GROUP' exactly in confirm_resource_group to delete it. No deletion was attempted."
            exit 1
          fi

      - name: 🔐 Azure Login
        if: inputs.stage != 'plan' || inputs.azure_login_for_plan
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: 🧭 Run scenario lifecycle
        run: |
          args=(
            "$SCENARIO_STAGE"
            --environment "$DEPLOY_ENVIRONMENT"
            --yes
          )
          if [[ -n "$SUBSCRIPTION_ID" ]]; then
            args+=(--subscription "$SUBSCRIPTION_ID")
          fi
          if [[ -n "$LOCATION" ]]; then
            args+=(--location "$LOCATION")
          fi
          if [[ -n "$SCENARIO_RESOURCE_GROUP" ]]; then
            args+=(--resource-group "$SCENARIO_RESOURCE_GROUP")
          fi

          "$SCENARIO_SCRIPT" "${args[@]}"

      - name: 📊 Summary
        if: always()
        run: |
          echo "## ${{ inputs.summary_heading }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scenario:** $SCENARIO_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Stage:** $SCENARIO_STAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** $DEPLOY_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$SCENARIO_RESOURCE_GROUP" ]]; then
            echo "**Resource group:** $SCENARIO_RESOURCE_GROUP" >> "$GITHUB_STEP_SUMMARY"
          fi