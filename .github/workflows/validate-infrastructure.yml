name: Validate deployment assets

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "apps/pawton-manufacturing/**"
      - "config/**"
      - "package*.json"
      - ".node-version"
      - ".github/workflows/**"
      - "azuredeploy.json"
      - "Dockerfile"
  push:
    branches: [main, dev]
    paths:
      - "infra/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "apps/pawton-manufacturing/**"
      - "config/**"
      - "package*.json"
      - ".node-version"
      - ".github/workflows/**"
      - "azuredeploy.json"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep-contract:
    # The reusable workflow declares id-token: write, so the caller must grant it
    # or the run fails before any job starts.
    permissions:
      contents: read
      id-token: write
    uses: ninjapaw/pawprint/.github/workflows/kit-bicep-validate.yml@3e261301bb1a70bcd25f3891117c16ebd8065ca5
    with:
      bicep-glob: "infra/**/*.bicep"
      check-committed-arm: true
      fail-on-lint-warning: true

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pawton-manufacturing/package-lock.json

      - name: Install test dependencies
        run: |
          npm ci
          npm ci --prefix apps/pawton-manufacturing

      - name: Validate repository and portal
        run: |
          bash scripts/test.sh --skip-azure
          npm test --prefix apps/pawton-manufacturing
          npm run build --prefix apps/pawton-manufacturing
