name: Validate deployment assets

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'azuredeploy.json'
      - 'Dockerfile'
  push:
    branches: [main, dev]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'azuredeploy.json'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep-contract:
    uses: ninjapaw/pawprint/.github/workflows/kit-bicep-validate.yml@18e1d946fa59333e4905a83759748f04887a5e02
    with:
      bicep-glob: "infra/**/*.bicep"
      check-committed-arm: true
      fail-on-lint-warning: true

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash scripts
        run: |
          bash scripts/test.sh --skip-report
          bash -n scripts/setup-azure-github-oidc.sh

      - name: Compile Bicep
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/main.bicep.json
          az bicep build --file infra/parameters.bicep --outfile /tmp/parameters.bicep.json

      - name: Validate JSON templates
        run: node -e "for (const file of ['infra/main.json','azuredeploy.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'));"