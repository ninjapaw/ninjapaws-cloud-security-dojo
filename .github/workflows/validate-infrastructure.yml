name: Validate deployment assets

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "azuredeploy.json"
      - "Dockerfile"
  push:
    branches: [main, dev]
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "azuredeploy.json"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep-contract:
    uses: ninjapaw/pawprint/.github/workflows/kit-bicep-validate.yml@3e261301bb1a70bcd25f3891117c16ebd8065ca5
    with:
      bicep-glob: "infra/**/*.bicep"
      check-committed-arm: true
      fail-on-lint-warning: true

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash scripts
        run: |
          bash scripts/test.sh --skip-report
          bash -n scripts/setup-azure-github-oidc.sh

      # Bicep compilation, linting and committed-ARM drift are owned by the Pawprint contract above.
      - name: Validate JSON templates
        run: node -e "for (const file of ['infra/main.json','azuredeploy.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'));"
