name: ✅ Remediation Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'app.js'
      - 'nginx.conf'

env:
  IMAGE_NAME: ninjapaws-dojo

jobs:
  validate-remediation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 🥷 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image from PR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            NGINX_VERSION=1.30.4
            VULNERABILITY_STATUS=remediated
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Generate Remediation Report
        run: |
          echo "## ⚔️ Remediation Validation Report" > validation-report.md
          echo "" >> validation-report.md
          echo "### Image Validation" >> validation-report.md
          echo "" >> validation-report.md
          echo "✅ **Status:** Image and runtime validation pending" >> validation-report.md
          echo "**Container security scanning:** Microsoft Defender for Cloud scans trusted images published to ACR." >> validation-report.md
          cat validation-report.md

      - name: 🧪 Test Application
        run: |
          docker run -d \
            --name dojo-test \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          
          echo "Waiting for application to start..."
          sleep 5
          
          echo "Testing endpoints..."
          
          # Test health endpoint
          if curl -sf http://localhost:3000/health > /dev/null; then
            echo "✅ /health endpoint working"
          else
            echo "❌ /health endpoint failed"
            exit 1
          fi
          
          # Test status endpoint
          if curl -sf http://localhost:3000/api/status > /dev/null; then
            echo "✅ /api/status endpoint working"
          else
            echo "❌ /api/status endpoint failed"
            exit 1
          fi

          VULNERABILITY_STATUS=$(curl -sf http://localhost:3000/api/status | jq -r '.vulnerability.status')
          if [ "$VULNERABILITY_STATUS" != "remediated" ]; then
            echo "❌ Image still reports vulnerability status: $VULNERABILITY_STATUS"
            exit 1
          fi
          echo "✅ Image reports remediated vulnerability status"
          
          # Test homepage
          if curl -sf http://localhost:3000/ > /dev/null; then
            echo "✅ / homepage working"
          else
            echo "❌ / homepage failed"
            exit 1
          fi
          
          echo "All endpoints healthy!"
          docker stop dojo-test

      - name: 📊 Extract NGINX version
        run: |
          docker run --rm \
            ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
            nginx -v 2>&1 | tee nginx-version.txt
          NGINX_VERSION=$(sed -n 's#.*nginx/\([0-9.]*\).*#\1#p' nginx-version.txt)
          test "$(printf '%s\n' '1.30.4' "$NGINX_VERSION" | sort -V | head -n1)" = '1.30.4'

      - name: 💬 Comment Validation Results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report + '\n\n### ✅ Testing Results\n\n- ✅ Health endpoint functional\n- ✅ API status endpoint functional\n- ✅ Homepage rendering correctly\n- ✅ Application startup successful\n\n**Next Steps:** \n1. Review vulnerability scan results\n2. Verify NGINX version is updated\n3. Approve and merge PR\n4. Monitor deployment with Microsoft Defender for Cloud'
            })

      - name: 🚀 Request Deployment Review
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security-remediation', 'validated']
            })
