services:
  dojo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_OS_IMAGE: ${BASE_OS_IMAGE:-ubuntu}
        BASE_OS_VERSION: ${BASE_OS_VERSION:-24.04}
        NGINX_VERSION: ${NGINX_VERSION:-1.30.3}
        NODE_MAJOR_VERSION: ${NODE_MAJOR_VERSION:-20}
        VULNERABILITY_STATUS: ${VULNERABILITY_STATUS:-vulnerable}
        PORT: ${PORT:-3000}
    ports:
      - "8080:80"
      - "3000:3000"
    environment:
      BASE_OS_IMAGE: ${BASE_OS_IMAGE:-ubuntu}
      BASE_OS_VERSION: ${BASE_OS_VERSION:-24.04}
      NGINX_VERSION: ${NGINX_VERSION:-1.30.3}
      NODE_MAJOR_VERSION: ${NODE_MAJOR_VERSION:-20}
      VULNERABILITY_STATUS: ${VULNERABILITY_STATUS:-vulnerable}
      PORT: ${PORT:-3000}
      DEFENDER_ENABLED: ${DEFENDER_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./app.js:/app/app.js:ro
