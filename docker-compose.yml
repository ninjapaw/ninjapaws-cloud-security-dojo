services:
  dojo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:?Run scripts/compose.sh so values load from config/deployment.json}
        NGINX_VERSION: ${NGINX_VERSION:?Run scripts/compose.sh so values load from config/deployment.json}
        NODE_MAJOR_VERSION: ${NODE_MAJOR_VERSION:?Run scripts/compose.sh so values load from config/deployment.json}
        VULNERABILITY_STATUS: ${VULNERABILITY_STATUS:?Run scripts/compose.sh so values load from config/deployment.json}
        PORT: ${PORT:?Run scripts/compose.sh so values load from config/deployment.json}
    ports:
      - "8080:80"
      - "3000:3000"
    environment:
      NGINX_VERSION: ${NGINX_VERSION:?Run scripts/compose.sh so values load from config/deployment.json}
      VULNERABILITY_STATUS: ${VULNERABILITY_STATUS:?Run scripts/compose.sh so values load from config/deployment.json}
      PORT: ${PORT:?Run scripts/compose.sh so values load from config/deployment.json}
      DEFENDER_ENABLED: ${DEFENDER_ENABLED:?Run scripts/compose.sh so values load from config/deployment.json}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    volumes:
      - ./container/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/app.js:/app/src/app.js:ro
